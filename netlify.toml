# Site entierement statique : rien a construire, on publie le depot tel quel.
[build]
  publish = "."
  command = "npm test"

# Le runner de tests de Node a besoin d'une version récente pour les globs.
[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Une heure de cache sur des modules ES sans empreinte dans le nom, c'est la
# garantie qu'un correctif reste invisible pendant une heure — et qu'un
# navigateur mélange un `main.js` neuf avec un moteur périmé. Le site pèse
# 357 Ko : une revalidation par minute ne coûte rien, et l'ETag renvoie 304.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
